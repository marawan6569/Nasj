name: Approved binary backfill (public write)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful manual main Linux release preparation run ID
        required: true
      tag:
        description: Existing annotated release tag
        default: v0.1.0
        required: true
      commit:
        description: Approved immutable source SHA
        default: b60cb2e045fc9476034bffba7967b8674825fa18
        required: true
      approval:
        description: 'Explicit public upload approval: publish <tag> from run <run_id>'
        required: true
      resume:
        description: Recover interruption; skip existing assets only if bytes match
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: binary-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    # Configure required maintainer reviewers and main-only deployment policy.
    environment: release-binaries
    permissions:
      actions: read
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-linux-binaries
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Recheck trusted run, provenance, immutable tag, checksums and collisions; add assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          PUBLICATION_APPROVAL: ${{ inputs.approval }}
          RESUME: ${{ inputs.resume }}
        run: |
          resume=()
          if [[ "$RESUME" == true ]]; then resume+=(--resume); fi
          python3 tooling/tools/release/publish.py --directory dist --source source \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --run-id "$BUILD_RUN_ID" "${resume[@]}"
