name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - run: python3 tools/report-csp.py --check
      - run: python3 tools/branding.py --check
      - run: cargo fmt --manifest-path tools/parser-spike/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tools/parser-spike/Cargo.toml
      - name: Verify offline browser reports
        run: |
          python3 -m venv /tmp/nasj-browser-venv
          /tmp/nasj-browser-venv/bin/pip install -r tools/browser-requirements.txt
          /tmp/nasj-browser-venv/bin/playwright install chromium
          /tmp/nasj-browser-venv/bin/python tools/browser-smoke.py
