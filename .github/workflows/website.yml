name: Website foundation

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'assets/logos/**'
      - 'fixtures/nginx/multi-vhost.conf'
      - 'AGENTS.md'
      - '.editorconfig'
      - 'LICENSE'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'assets/logos/**'
      - 'fixtures/nginx/multi-vhost.conf'
      - 'AGENTS.md'
      - '.editorconfig'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit
      - run: npm run format:check
      - run: npm run check
      - run: npm run verify:dependencies
      - name: Verify production artifacts
        id: production
        run: |
          npm run build
          npm run verify
          npm run test:artifacts
      - id: browsers
        run: npx playwright install --with-deps chromium
      - name: Project-prefix browser tests
        env:
          WEBSITE_TEST_RUN: project
        run: npm test -- --update-snapshots=none
      - name: Verify a deeper Pages prefix
        if: ${{ !cancelled() && steps.production.outcome == 'success' && steps.browsers.outcome == 'success' }}
        env:
          WEBSITE_BASE: /review/Nasj/
          WEBSITE_TEST_RUN: deeper
        run: |
          npm run build
          npm run verify
          npm test -- --grep 'real 404|theme precedence|effective production CSP|no JavaScript' --update-snapshots=none
      - name: Save browser evidence (no deployment)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-browser-evidence
          path: |
            website/test-results/
            website/playwright-report/
          retention-days: 7
