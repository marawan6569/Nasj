[workspace]
resolver = "2"
members = ["crates/nasj-core", "crates/nasj-export", "crates/nasj-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/marawan6569/Nasj"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
libc = "0.2"
tempfile = "3"
