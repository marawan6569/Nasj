# Entirely synthetic deployment-shaped fixture; no production data.
include optional-modules-example-*.conf;
include optional-sites-example-*.conf;
http {
    root /srv/example-default;
    upstream portal_app {
        server 127.0.0.1:8100;
        server 127.0.0.1:8101 backup;
    }
    upstream api_app {
        server 127.0.0.1:8200;
        server [::1]:8201;
    }
    server {
        listen 80;
        server_name portal.example.test www.portal.example.test;
        if ($host = portal.example.test) { return 301 https://$host$request_uri; }
        return 404;
    }
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name portal.example.test www.portal.example.test;
        location / { proxy_pass http://portal_app; }
        location /assets/ { alias /srv/example-assets/; }
        location = /health { return 204; }
        location /api/ { proxy_pass http://api_app; }
    }
    server {
        listen 80;
        server_name api.example.test;
        if ($host = api.example.test) { return 308 https://$host$request_uri; }
        return 404;
    }
    server {
        listen 443 ssl;
        server_name api.example.test;
        location / { proxy_pass http://api_app; }
        location /docs/ { root /srv/example-docs; }
        location = /status { return 200 "synthetic ok"; }
    }
}
