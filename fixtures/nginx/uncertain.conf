http {
    upstream app { server 127.0.0.1:8000; }
    upstream APP { server 127.0.0.1:8001; }
    server {
        listen 127.0.0.1;
        listen [::1];
        server_name example.test;
        location /ambiguous { proxy_pass http://app; }
        location /var { proxy_pass http://$backend; }
        location /rewrite { rewrite ^ /elsewhere last; proxy_pass http://not-effective.test; }
        location /try { try_files $uri @fallback; proxy_pass http://not-effective.test; }
        location /secret { proxy_pass http://user:fixture-secret@example.test/; }
        location /fastcgi { fastcgi_pass 127.0.0.1:9000; }
    }
}
