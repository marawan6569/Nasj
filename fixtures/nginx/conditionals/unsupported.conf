http {
    root /srv/synthetic-www;
    server {
        listen 80;
        if ($host ~ "^example") { return 301 https://$host$request_uri; }
        return 404;
    }
    server {
        listen 8080;
        if ($host = example.test) { if ($request_method = GET) { return 301 https://$host$request_uri; } }
        return 404;
    }
    server {
        listen 8081;
        set $host altered.example.test;
        if ($host = example.test) { return 301 https://$host$request_uri; }
        return 404;
    }
    server {
        listen 8082;
        location / { if ($host = example.test) { return 301 https://$host$request_uri; } return 404; }
    }
    server {
        listen 8083;
        if ($http_authorization = fixture-private-value) { return 401; }
        return 404;
    }
}
