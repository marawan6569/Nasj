http {
    server {
        listen 80;
        if ( $request_method != "GET" ) { return 405; }
        if ($host = "api.example.test") { return 302 https://$host$request_uri; }
        return 404;
        return 200 "unreachable synthetic body";
    }
    server {
        listen 8080;
        return 204;
        if ($host ~ example) { return 302 https://ignored.example.test; }
        return 404;
    }
    server {
        listen 8081;
        location / { return 201; return 503; }
    }
}
