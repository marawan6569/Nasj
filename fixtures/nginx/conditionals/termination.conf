http {
    root /srv/synthetic-default;
    server {
        listen 80;
        return 204;
        rewrite ^ /unreachable last;
        set $host unreachable.example.test;
        return 503;
        location / { proxy_pass http://127.0.0.1:8400; }
    }
    server {
        listen 8080;
        if ($host = example.test) { return 301 https://$host$request_uri; }
        return 404;
        location /static/ {
            root /srv/unreachable-example;
            location /static/child/ { }
        }
    }
}
