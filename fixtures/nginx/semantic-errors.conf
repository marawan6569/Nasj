http {
    upstream app { server 127.0.0.1:8000; }
    server {
        listen 70000;
        listen unix:;
        location /alias {
            alias /srv/assets/;
            location /alias/child { }
        }
        location /duplicate {
            proxy_pass http://app;
            proxy_pass http://other.test;
            location /duplicate/child { }
        }
        location /conflict {
            root /srv/root;
            alias /srv/alias;
        }
    }
}
