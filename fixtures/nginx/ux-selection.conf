# Synthetic: TLS-only redirects/responses and plain HTTP application routes.
http {
    upstream unattached_example { server 127.0.0.1:8999; }
    server { listen 443 ssl; server_name a-redirect.example.test; return 301 https://example.test; }
    server { listen 443; server_name plain443.example.test; location / { proxy_pass http://127.0.0.1:8100; } }
    server {
        listen 80;
        server_name app.example.test;
        location / { proxy_pass http://127.0.0.1:8200; }
        location /assets/ { alias /srv/example-assets/; }
    }
    server { listen 8443 ssl; server_name tls-response.example.test; return 404; }
}
