location /api { proxy_pass http://app; }
location = /health { return 200 "private response body"; }
location ~ "^/assets/[0-9]{2}/" { alias /srv/assets/; }
location ^~ /static/ { root /srv/static; }
location /old { return 301 https://example.test/new?token=fixture-secret; }
location /dynamic { proxy_pass http://${backend}:8080$request_uri; }
location /conditional {
    if ($request_method = POST) { proxy_pass http://conditional.test; }
    proxy_pass http://do-not-confirm.test;
}
location /nested {
    proxy_pass http://app;
    location /nested/child { }
}
