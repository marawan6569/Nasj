http {
    root /srv/synthetic-www;
    server {
        listen 80;
        server_name handlers.example.test;
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            location /api/empty/ { }
            location /api/explicit/ { proxy_pass http://127.0.0.1:8001; }
        }
        location /php/ {
            fastcgi_pass 127.0.0.1:9000;
            location /php/static/ { }
            location /php/explicit/ { fastcgi_pass 127.0.0.1:9001; }
        }
        location /uwsgi/ { uwsgi_pass 127.0.0.1:9002; }
        location /scgi/ { scgi_pass 127.0.0.1:9003; }
        location /grpc/ { grpc_pass grpc://127.0.0.1:9004; }
        location /dynamic/ { proxy_pass http://$backend; }
    }
}
