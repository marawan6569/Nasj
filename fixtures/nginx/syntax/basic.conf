# Sanitized parser comparison fixture
events { worker_connections 128; }
http {
    upstream app {
        server 127.0.0.1:8000;
        server [::1]:8001 backup;
    }
    server {
        listen 80;
        listen [::]:443 ssl;
        server_name example.test *.example.test;
        location / { proxy_pass http://app; }
        location = /health { return 200 "ok"; }
        location ~ "^/v[0-9]{1,2}/" { proxy_pass http://app; }
        location /dynamic { proxy_pass http://${backend}:8080$request_uri; }
    }
}
